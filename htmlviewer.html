<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>V4K Pro - Advanced Text Tool</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
<style>
body{margin:0;background:#000;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;color:#fff;user-select:none}
#app-container{position:relative;width:100vw;height:100vh;display:flex;justify-content:center;align-items:center}
#media-wrapper{position:relative;width:100%;height:100%;display:flex;justify-content:center;align-items:center;transition:transform .3s ease}
video{width:100%;height:100%;object-fit:contain}
#draw-layer{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10}
#shape-container{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:15;overflow:hidden}
.draggable-shape{position:absolute;border:4px solid #34c759;background:rgba(52,199,89,.2);pointer-events:auto;box-sizing:border-box;transition:border-color .2s;cursor:grab}
.draggable-shape:active{cursor:grabbing}
.draggable-shape:hover{border-color:#ff3b30}
.shape-circle{border-radius:50%}
.draggable-text{position:absolute;font-family:inherit;font-weight:700;color:#fff;white-space:nowrap;padding:5px;cursor:grab;border:2px dashed transparent;pointer-events:auto;text-shadow:2px 2px 8px rgba(0,0,0,.8);box-sizing:border-box;user-select:none}
.draggable-text.selected{border-color:rgba(255,255,255,.8);background:rgba(0,0,0,.3)}
.draggable-text[contenteditable=true]{outline:0;cursor:text;user-select:text}
.draggable-text:active:not([contenteditable=true]){cursor:grabbing}

/* Advanced Floating Menu */
#text-edit-controls{position:absolute;z-index:50;display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.85);backdrop-filter:blur(10px);padding:8px 16px;border-radius:20px;pointer-events:auto;border:1px solid rgba(255,255,255,.2);box-shadow:0 10px 25px rgba(0,0,0,.7);transition:opacity .2s}
#text-edit-controls.hidden{opacity:0;pointer-events:none}
.btn-text-action{position:relative;background:0 0;color:#fff;border:none;width:36px;height:36px;border-radius:50%;display:flex;justify-content:center;align-items:center;transition:.2s;cursor:pointer}
.btn-text-action:hover{background:rgba(255,255,255,.2)}

/* Custom Dropdown */
.custom-dropdown{position:relative;width:130px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);border-radius:8px;color:#fff;font-size:14px;cursor:pointer;user-select:none}
.dropdown-selected{padding:6px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;justify-content:space-between}
.dropdown-selected::after{content:'▼';font-size:10px;opacity:0.7}
.dropdown-options{position:absolute;top:calc(100% + 5px);left:0;width:100%;background:rgba(20,20,20,.95);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);border-radius:8px;display:none;flex-direction:column;max-height:200px;overflow-y:auto;box-shadow:0 10px 25px rgba(0,0,0,.8);z-index:60}
.dropdown-options.show{display:flex}
.dropdown-option{padding:10px;transition:background .2s;border-bottom:1px solid rgba(255,255,255,.05)}
.dropdown-option:last-child{border-bottom:none}
.dropdown-option:hover{background:rgba(52,199,89,.4)}

/* Custom Slider */
.slider-container{display:flex;align-items:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:4px 10px;height:24px}
.custom-range{-webkit-appearance:none;width:90px;background:0 0;margin:0 8px;cursor:pointer}
.custom-range:focus{outline:0}
.custom-range::-webkit-slider-runnable-track{width:100%;height:6px;background:rgba(255,255,255,.2);border-radius:3px}
.custom-range::-webkit-slider-thumb{height:16px;width:16px;border-radius:50%;background:#34c759;cursor:pointer;-webkit-appearance:none;margin-top:-5px;box-shadow:0 2px 5px rgba(0,0,0,.5);transition:transform .1s}
.custom-range::-webkit-slider-thumb:hover{transform:scale(1.2)}
.custom-range:focus::-webkit-slider-runnable-track{background:rgba(255,255,255,.3)}
.size-readout{font-size:12px;width:35px;text-align:right;font-variant-numeric:tabular-nums}

.draggable-img{position:absolute;pointer-events:auto;cursor:grab;border:2px solid transparent;transition:border-color .2s}
.draggable-img:active{cursor:grabbing}
.draggable-img:hover{border-color:#ff3b30}
.draggable-img img{display:block;max-width:500px;max-height:500px;pointer-events:none}
#ui-layer{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:15px;z-index:30;transition:opacity .4s ease,transform .4s ease}
#ui-layer.hidden{opacity:0;transform:translateX(-50%) translateY(30px);pointer-events:none}
.bottom-bars{display:flex;gap:15px}
.controls{background:rgba(255,255,255,.1);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.2);padding:10px 20px;border-radius:40px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.icon-btn{position:relative;background:0 0;color:#fff;border:none;width:45px;height:45px;border-radius:50%;display:flex;justify-content:center;align-items:center;transition:.2s;cursor:pointer}
.icon-btn:hover{background:rgba(255,255,255,.2)}
.icon-btn.active{background:#34c759;color:#000}
.icon-btn.active .shortcut-badge{background:#000;color:#fff}
.shortcut-badge{position:absolute;top:2px;right:2px;background:rgba(255,255,255,.8);color:#000;font-size:10px;font-weight:700;border-radius:50%;width:14px;height:14px;display:flex;justify-content:center;align-items:center;pointer-events:none;text-transform:uppercase}
.material-symbols-outlined{font-size:24px}
.draw-settings-bar{display:none}
.color-wrapper{position:relative;display:flex;justify-content:center;align-items:center}
.color-picker{-webkit-appearance:none;border:none;width:36px;height:36px;border-radius:50%;cursor:pointer;padding:0;background:0 0}
.color-picker::-webkit-color-swatch-wrapper{padding:0}
.color-picker::-webkit-color-swatch{border:2px solid rgba(255,255,255,.5);border-radius:50%}
.mirror{transform:scaleX(-1)}
.rotate180{transform:rotate(180deg)}
.mirror.rotate180{transform:scaleX(-1) rotate(180deg)}
#status-panel{position:absolute;bottom:30px;right:30px;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);padding:12px;border-radius:20px;display:flex;align-items:center;gap:12px;z-index:20;border:1px solid rgba(255,255,255,.1)}
.status-dot{width:16px;height:16px;border-radius:50%;background:#444;box-shadow:inset 0 2px 4px rgba(0,0,0,.5);transition:background .3s,box-shadow .3s,color .3s;display:flex;justify-content:center;align-items:center;color:#fff;font-size:10px;font-weight:800}
.dot-green{background:#34c759;box-shadow:0 0 10px #34c759;color:#000}
.dot-purple{background:#bf5af2;box-shadow:0 0 10px #bf5af2;color:#fff}
.dot-orange{background:#ff9f0a;box-shadow:0 0 10px #ff9f0a;color:#000}
.divider{width:1px;height:30px;background:rgba(255,255,255,.2)}
</style>
</head>
<body>
<div id="app-container">
    <div id="media-wrapper">
        <video id="v4k-video" autoplay playsinline></video>
        <canvas id="draw-layer"></canvas>
        <div id="shape-container"></div>
    </div>
    
    <div id="text-edit-controls" class="hidden">
        <span class="material-symbols-outlined" style="opacity:0.6; font-size: 20px;">font_download</span>
        
        <div class="custom-dropdown" id="font-dropdown" title="Font Style">
            <div class="dropdown-selected" id="font-selected" style="font-family: system-ui, sans-serif">Default</div>
            <div class="dropdown-options" id="font-options">
                <div class="dropdown-option" data-value="system-ui, sans-serif" style="font-family: system-ui, sans-serif">Default</div>
                <div class="dropdown-option" data-value="Arial, sans-serif" style="font-family: Arial, sans-serif">Arial</div>
                <div class="dropdown-option" data-value="'Courier New', monospace" style="font-family: 'Courier New', monospace">Courier</div>
                <div class="dropdown-option" data-value="Georgia, serif" style="font-family: Georgia, serif">Georgia</div>
                <div class="dropdown-option" data-value="Impact, sans-serif" style="font-family: Impact, sans-serif">Impact</div>
                <div class="dropdown-option" data-value="'Comic Sans MS', cursive" style="font-family: 'Comic Sans MS', cursive">Comic Sans</div>
            </div>
        </div>
        
        <span class="material-symbols-outlined" style="opacity:0.6; font-size: 20px; margin-left: 4px;">palette</span>
        <input type="color" id="floating-color" class="color-picker" title="Text Color" style="width: 28px; height: 28px;"> 
        
        <span class="material-symbols-outlined" style="opacity:0.6; font-size: 20px; margin-left: 4px;">format_size</span>
        
        <div class="slider-container" title="Font Size">
            <input type="range" id="floating-size" class="custom-range" min="12" max="150" value="36">
            <span class="size-readout" id="size-readout">36px</span>
        </div>
        
        <div class="divider" style="margin: 0 4px;"></div>
        
        <button class="btn-text-action" onclick="deleteActiveText()" title="Delete">
            <span class="material-symbols-outlined" style="font-size: 20px;">delete</span>
        </button>
        <button class="btn-text-action" onclick="deselectText()" title="Done">
            <span class="material-symbols-outlined" style="font-size: 20px;">check</span>
        </button>
    </div>

    <div id="ui-layer" class="hidden">
        <div class="controls draw-settings-bar" id="draw-settings">
            <div class="color-wrapper" id="draw-color-wrapper" title="Color">
                <input type="color" id="color-picker" class="color-picker" value="#ff3b30">
            </div>
            <div id="draw-size-wrapper" style="display:flex; align-items:center;">
                <input type="range" id="line-width" class="custom-range" min="1" max="30" value="5" title="Pen Size" style="width: 100px;">
            </div>
        </div>
        <div class="bottom-bars">
            <div class="controls sys-bar">
                <button class="icon-btn" id="btn-cam" onclick="pickV4K()" title="Select Camera"><span class="material-symbols-outlined">usb</span><span class="shortcut-badge">1</span></button>
                <button class="icon-btn" onclick='executeAction("fullscreen")' title="Full Screen"><span class="material-symbols-outlined">fullscreen</span><span class="shortcut-badge">2</span></button>
                <button class="icon-btn" onclick='executeAction("mirror")' title="Mirror"><span class="material-symbols-outlined">flip</span><span class="shortcut-badge">3</span></button>
                <button class="icon-btn" onclick='executeAction("rotate")' title="Rotate 180°"><span class="material-symbols-outlined">rotate_right</span><span class="shortcut-badge">4</span></button>
                <button class="icon-btn" onclick='executeAction("clear")' title="Clear All Ink"><span class="material-symbols-outlined">delete</span><span class="shortcut-badge">5</span></button>
            </div>
            <div class="controls draw-bar">
                <button class="icon-btn" id="btn-draw" onclick='setTool("draw")' title="Pen Tool (Cycle Color with 6)"><span class="material-symbols-outlined">draw</span><span class="shortcut-badge">6</span></button>
                <button class="icon-btn" id="btn-eraser" onclick='setTool("eraser")' title="Eraser Tool"><span class="material-symbols-outlined">ink_eraser</span><span class="shortcut-badge">7</span></button>
                <button class="icon-btn" id="btn-circle" onclick='setTool("circle")' title="Draw Circle"><span class="material-symbols-outlined">circle</span><span class="shortcut-badge">8</span></button>
                <button class="icon-btn" id="btn-square" onclick='setTool("square")' title="Draw Square"><span class="material-symbols-outlined">square</span><span class="shortcut-badge">9</span></button>
            </div>
            <div class="controls media-bar">
                <button class="icon-btn" id="btn-text" onclick='setTool("text")' title="Add Text"><span class="material-symbols-outlined">title</span><span class="shortcut-badge">T</span></button>
                <button class="icon-btn" onclick="triggerImageUpload()" title="Insert Image"><span class="material-symbols-outlined">image</span><span class="shortcut-badge">I</span></button>
                <input type="file" id="image-upload" accept="image/*" style="display:none">
            </div>
        </div>
    </div>
    
    <div id="status-panel">
        <div class="status-dot" id="dot-cam" title="Camera Connection"></div>
        <div class="status-dot" id="dot-draw" title="Pen Tool Active"></div>
        <div class="status-dot" id="dot-shape" title="Shape/Text Tool Active"></div>
    </div>
</div>

<script>
    // ==========================================
    // 1. GLOBAL VARIABLES & DOM ELEMENTS
    // ==========================================
    const uiLayer = document.getElementById('ui-layer');
    const textControlsPanel = document.getElementById('text-edit-controls');
    const shapeContainer = document.getElementById('shape-container');
    const mediaWrapper = document.getElementById('media-wrapper');
    const video = document.getElementById('v4k-video');
    const canvas = document.getElementById('draw-layer');
    const ctx = canvas.getContext('2d');
    
    // UI Buttons & Inputs
    const btnDraw = document.getElementById('btn-draw');
    const btnEraser = document.getElementById('btn-eraser');
    const btnText = document.getElementById('btn-text');
    const btnCircle = document.getElementById('btn-circle');
    const btnSquare = document.getElementById('btn-square');
    
    const drawSettings = document.getElementById('draw-settings');
    const drawColorWrapper = document.getElementById('draw-color-wrapper');
    const colorPicker = document.getElementById('color-picker');
    const lineWidthSlider = document.getElementById('line-width');
    
    const dotDraw = document.getElementById('dot-draw');
    const dotShape = document.getElementById('dot-shape');
    const dotCam = document.getElementById('dot-cam');

    // Floating Text UI Inputs
    const floatingColor = document.getElementById('floating-color');
    const floatingSize = document.getElementById('floating-size');
    const sizeReadout = document.getElementById('size-readout');
    
    // Custom Font Dropdown Elements
    const fontDropdown = document.getElementById('font-dropdown');
    const fontSelected = document.getElementById('font-selected');
    const fontOptions = document.getElementById('font-options');
    const fontOptionItems = document.querySelectorAll('.dropdown-option');

    // State Trackers
    let idleTimeout;
    let activeTool = 'cursor'; 
    let isMirrored = false;
    let isRotated = false;
    let isDrawing = false;
    let isCreatingShape = false;
    let currentShape = null;
    let selectedText = null; 
    let startX = 0, startY = 0;
    
    const presetColors = ['#ff3b30', '#ff9f0a', '#ffcc00', '#34c759', '#0a84ff', '#bf5af2', '#ffffff', '#000000'];
    let currentColorIndex = 0;

    // ==========================================
    // 2. INITIALIZATION (Canvas Sizing)
    // ==========================================
    function resizeCanvas() {
        canvas.width = mediaWrapper.clientWidth;
        canvas.height = mediaWrapper.clientHeight;
        if(selectedText) updateTextControlsPosition();
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas(); 

    // ==========================================
    // 3. AUTO-HIDE MOUSE & UI LOGIC
    // ==========================================
    document.addEventListener('mousemove', (e) => {
        document.body.style.cursor = 'default';

        if (e.clientY > window.innerHeight - 160) {
            uiLayer.classList.remove('hidden');
        } else {
            uiLayer.classList.add('hidden');
        }

        clearTimeout(idleTimeout);
        idleTimeout = setTimeout(() => {
            if (!isDrawing && !isCreatingShape && activeTool !== 'text' && !selectedText) {
                document.body.style.cursor = 'none';
                uiLayer.classList.add('hidden');
            }
        }, 2500);
    });

    // ==========================================
    // 4. CORE TOOL SELECTION & ACTIONS
    // ==========================================
    function handleDrawAction() {
        if (activeTool === 'draw') {
            if (currentColorIndex === presetColors.length - 1) {
                currentColorIndex = 0;
                setTool('cursor');
            } else {
                currentColorIndex++;
                colorPicker.value = presetColors[currentColorIndex];
                updateDrawDotColor();
            }
        } else {
            setTool('draw');
            currentColorIndex = 0;
            colorPicker.value = presetColors[currentColorIndex];
            updateDrawDotColor();
        }
    }

    function updateDrawDotColor() {
        const color = colorPicker.value;
        dotDraw.style.background = color;
        dotDraw.style.boxShadow = `0 0 10px ${color}`;
        
        const isLight = (color === '#ffffff' || color === '#ffcc00' || color === '#34c759');
        dotDraw.style.color = isLight ? 'black' : 'white';
        dotDraw.innerText = 'D';
    }

    // Main Draw Toolbar Events
    colorPicker.addEventListener('input', () => {
        if (activeTool !== 'draw') setTool('draw');
        updateDrawDotColor();
    });

    function setTool(tool) {
        if (activeTool === tool) tool = 'cursor';
        activeTool = tool;

        btnDraw.classList.remove('active');
        btnEraser.classList.remove('active');
        btnText.classList.remove('active');
        btnCircle.classList.remove('active');
        btnSquare.classList.remove('active');
        
        canvas.style.pointerEvents = 'none';
        shapeContainer.style.pointerEvents = 'none';
        drawSettings.style.display = 'none';
        
        dotDraw.className = 'status-dot';
        dotDraw.style.background = '';
        dotDraw.style.boxShadow = '';
        dotDraw.style.color = '';
        dotShape.className = 'status-dot';
        dotDraw.innerText = '';
        dotShape.innerText = '';

        if (tool === 'draw') {
            btnDraw.classList.add('active');
            canvas.style.pointerEvents = 'auto';
            canvas.style.cursor = 'crosshair';
            drawColorWrapper.style.display = 'flex'; // Show color picker
            drawSettings.style.display = 'flex'; 
            updateDrawDotColor(); 
        } 
        else if (tool === 'eraser') {
            btnEraser.classList.add('active');
            canvas.style.pointerEvents = 'auto';
            canvas.style.cursor = 'cell';
            dotDraw.classList.add('dot-orange');
            dotDraw.innerText = 'E';
            drawColorWrapper.style.display = 'none'; // Hide color picker, keep size
            drawSettings.style.display = 'flex'; 
        }
        else if (tool === 'text') {
            btnText.classList.add('active');
            shapeContainer.style.pointerEvents = 'auto';
            shapeContainer.style.cursor = 'text';
            dotShape.classList.add('dot-orange');
            dotShape.innerText = 'T';
        }
        else if (tool === 'circle' || tool === 'square') {
            if(tool === 'circle') btnCircle.classList.add('active');
            if(tool === 'square') btnSquare.classList.add('active');
            
            shapeContainer.style.pointerEvents = 'auto'; 
            shapeContainer.style.cursor = 'crosshair';
            dotShape.classList.add('dot-purple');
            dotShape.innerText = tool === 'circle' ? 'C' : 'S';
        }
    }

    function executeAction(action) {
        if (action !== 'clear') setTool('cursor'); 

        if (action === 'mirror') {
            isMirrored = !isMirrored;
            updateTransforms();
        } else if (action === 'rotate') {
            isRotated = !isRotated;
            updateTransforms();
        } else if (action === 'clear') {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        } else if (action === 'fullscreen') {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        }
    }

    document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.isContentEditable) return;
        switch(e.key) {
            case '1': pickV4K(); break;
            case '2': executeAction('fullscreen'); break;
            case '3': executeAction('mirror'); break;
            case '4': executeAction('rotate'); break;
            case '5': executeAction('clear'); break;
            case '6': handleDrawAction(); break;
            case '7': setTool('eraser'); break;
            case '8': setTool('circle'); break;
            case '9': setTool('square'); break;
            case 't': case 'T': setTool('text'); break;
            case 'i': case 'I': triggerImageUpload(); break;
            case 'Escape': setTool('cursor'); deselectText(); break;
        }
    });

    // ==========================================
    // 5. CAMERA & VIEW TRANSFORMS
    // ==========================================
    async function pickV4K() {
        setTool('cursor');
        try {
            const usbDevice = await navigator.usb.requestDevice({ filters: [] });
            const devices = await navigator.mediaDevices.enumerateDevices();
            const videoDevices = devices.filter(d => d.kind === 'videoinput');
            
            let targetId = null;
            videoDevices.forEach(device => {
                if (device.label.includes(usbDevice.productName) || device.label.toLowerCase().includes("v4k")) {
                    targetId = device.deviceId;
                }
            });

            const stream = await navigator.mediaDevices.getUserMedia({
                video: { deviceId: targetId ? { exact: targetId } : undefined, width: { ideal: 3840 }, height: { ideal: 2160 } }
            });
            video.srcObject = stream;
            
            document.getElementById('btn-cam').classList.add('active');
            dotCam.className = 'status-dot dot-green';
        } catch (err) { console.error(err); }
    }

    function updateTransforms() {
        mediaWrapper.className = '';
        if (isMirrored) mediaWrapper.classList.add('mirror');
        if (isRotated) mediaWrapper.classList.add('rotate180');
    }

    // ==========================================
    // 6. PEN & ERASER LOGIC
    // ==========================================
    canvas.addEventListener('mousedown', (e) => {
        if (activeTool !== 'draw' && activeTool !== 'eraser') return;
        isDrawing = true; 
        
        ctx.beginPath(); 
        ctx.moveTo(e.offsetX, e.offsetY);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        if (activeTool === 'eraser') {
            ctx.globalCompositeOperation = 'destination-out';
            ctx.lineWidth = lineWidthSlider.value * 2; 
        } else {
            ctx.globalCompositeOperation = 'source-over';
            ctx.strokeStyle = colorPicker.value;
            ctx.lineWidth = lineWidthSlider.value;
        }
    });

    canvas.addEventListener('mousemove', (e) => {
        if (!isDrawing || (activeTool !== 'draw' && activeTool !== 'eraser')) return;
        ctx.lineTo(e.offsetX, e.offsetY); 
        ctx.stroke();
    });

    window.addEventListener('mouseup', () => { 
        if(isDrawing) {
            isDrawing = false; 
            ctx.closePath(); 
        }
    });

    // ==========================================
    // 7. ADVANCED TEXT CONTROLS UI
    // ==========================================
    
    // Custom Font Dropdown Logic
    fontSelected.addEventListener('click', (e) => {
        fontOptions.classList.toggle('show');
        e.stopPropagation();
    });

    fontOptionItems.forEach(item => {
        item.addEventListener('click', (e) => {
            const value = e.target.getAttribute('data-value');
            const name = e.target.innerText;
            const fontFam = e.target.style.fontFamily;
            
            fontSelected.innerText = name;
            fontSelected.style.fontFamily = fontFam;
            fontOptions.classList.remove('show');
            
            if (selectedText) {
                selectedText.style.fontFamily = value;
                updateTextControlsPosition();
            }
            e.stopPropagation();
        });
    });

    // Live Text Edit Event Listeners
    floatingColor.addEventListener('input', (e) => {
        if (selectedText) selectedText.style.color = e.target.value;
    });
    
    floatingSize.addEventListener('input', (e) => {
        sizeReadout.innerText = e.target.value + 'px';
        if (selectedText) {
            selectedText.style.fontSize = e.target.value + 'px';
            updateTextControlsPosition();
        }
    });

    // Helper to extract hex from element computed style color
    function rgbToHex(rgb) {
        const match = rgb.match(/^rgb\((\d+),\s*(\d+),\s*(\d+)\)$/);
        if (!match) return rgb; 
        function hex(x) { return ("0" + parseInt(x).toString(16)).slice(-2); }
        return "#" + hex(match[1]) + hex(match[2]) + hex(match[3]);
    }

    function updateTextControlsPosition() {
        if (!selectedText) return;
        const rect = selectedText.getBoundingClientRect();
        textControlsPanel.style.left = Math.max(20, rect.left) + 'px';
        textControlsPanel.style.top = (rect.bottom + 15) + 'px';
    }

    function selectTextElement(el) {
        if (selectedText && selectedText !== el) deselectText();
        
        selectedText = el;
        el.classList.add('selected');

        // Sync floating menu values with the text element
        const styles = window.getComputedStyle(el);
        floatingColor.value = rgbToHex(styles.color);
        
        const fontSizePx = Math.round(parseFloat(styles.fontSize));
        floatingSize.value = fontSizePx;
        sizeReadout.innerText = fontSizePx + 'px';
        
        const currentFont = styles.fontFamily.replace(/"/g, "'");
        
        // Sync Custom Font Dropdown UI
        let foundFont = false;
        fontOptionItems.forEach(opt => {
            if(opt.getAttribute('data-value').includes(currentFont.split(',')[0])) {
                fontSelected.innerText = opt.innerText;
                fontSelected.style.fontFamily = opt.style.fontFamily;
                foundFont = true;
            }
        });
        if(!foundFont) {
            fontSelected.innerText = 'Default';
            fontSelected.style.fontFamily = 'system-ui, sans-serif';
        }

        textControlsPanel.classList.remove('hidden');
        updateTextControlsPosition();
    }

    function enterTextEditMode(el) {
        if(selectedText !== el) selectTextElement(el);
        
        el.contentEditable = true;
        el.focus();
        
        // Auto select text if it is the default phrase
        if (el.innerText === 'Double click to edit') {
            const range = document.createRange();
            range.selectNodeContents(el);
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(range);
        }
        
        el.addEventListener('input', updateTextControlsPosition);
    }

    function deselectText() {
        if (!selectedText) return;
        
        selectedText.classList.remove('selected');
        selectedText.contentEditable = false;
        selectedText.removeEventListener('input', updateTextControlsPosition);
        fontOptions.classList.remove('show');
        
        if (selectedText.innerText.trim() === '') {
            selectedText.remove();
        }

        selectedText = null;
        textControlsPanel.classList.add('hidden');
    }

    function deleteActiveText() {
        if (!selectedText) return;
        selectedText.remove();
        selectedText = null;
        textControlsPanel.classList.add('hidden');
        fontOptions.classList.remove('show');
    }

    // Window clicks (Close menus, deselect items)
    window.addEventListener('mousedown', (e) => {
        // Close font dropdown if clicked outside
        if (!fontDropdown.contains(e.target)) {
            fontOptions.classList.remove('show');
        }
        
        // Auto-finish editing if clicking outside the text and outside the text controls
        if (selectedText) {
            if (e.target !== selectedText && !textControlsPanel.contains(e.target)) {
                deselectText();
            }
        }
    });

    // ==========================================
    // 8. SHAPE & TEXT CREATION
    // ==========================================
    function getAdjustedCoords(e) {
        const rect = shapeContainer.getBoundingClientRect();
        let nx = (e.clientX - rect.left) / rect.width;
        let ny = (e.clientY - rect.top) / rect.height;

        if (isMirrored && !isRotated) nx = 1 - nx;
        else if (!isMirrored && isRotated) { nx = 1 - nx; ny = 1 - ny; }
        else if (isMirrored && isRotated) ny = 1 - ny; 

        return { x: nx * rect.width, y: ny * rect.height };
    }

    shapeContainer.addEventListener('mousedown', (e) => {
        if (e.target !== shapeContainer) return;

        if (activeTool === 'text') {
            const coords = getAdjustedCoords(e);
            
            const textEl = document.createElement('div');
            textEl.className = 'draggable-text';
            textEl.style.left = coords.x + 'px';
            textEl.style.top = coords.y + 'px';
            textEl.style.color = floatingColor.value || '#ffffff';
            textEl.style.fontSize = floatingSize.value + 'px';
            
            // Get currently active font from our custom dropdown
            let currentFontVal = 'system-ui, sans-serif';
            fontOptionItems.forEach(opt => {
                if(opt.innerText === fontSelected.innerText) currentFontVal = opt.getAttribute('data-value');
            });
            textEl.style.fontFamily = currentFontVal;
            
            textEl.innerText = 'Double click to edit'; 

            shapeContainer.appendChild(textEl);
            makeDraggable(textEl);
            
            // Select it automatically to show controls beneath it
            selectTextElement(textEl);

            setTool('cursor'); 
            return;
        }

        if (activeTool !== 'circle' && activeTool !== 'square') return;
        
        isCreatingShape = true;
        const coords = getAdjustedCoords(e);
        startX = coords.x;
        startY = coords.y;

        currentShape = document.createElement('div');
        currentShape.className = `draggable-shape ${activeTool === 'circle' ? 'shape-circle' : ''}`;
        currentShape.style.left = startX + 'px';
        currentShape.style.top = startY + 'px';
        currentShape.style.width = '0px';
        currentShape.style.height = '0px';

        shapeContainer.appendChild(currentShape);
    });

    window.addEventListener('mousemove', (e) => {
        if (!isCreatingShape || !currentShape) return;
        
        const coords = getAdjustedCoords(e);
        const currentX = coords.x;
        const currentY = coords.y;

        const width = Math.abs(currentX - startX);
        const height = Math.abs(currentY - startY);
        const left = Math.min(currentX, startX);
        const top = Math.min(currentY, startY);

        currentShape.style.width = width + 'px';
        currentShape.style.height = height + 'px';
        currentShape.style.left = left + 'px';
        currentShape.style.top = top + 'px';
    });

    window.addEventListener('mouseup', () => {
        if (isCreatingShape && currentShape) {
            makeDraggable(currentShape);
            setTool('cursor');
        }
        isCreatingShape = false;
        currentShape = null;
    });

    // ==========================================
    // 9. IMAGE UPLOAD LOGIC
    // ==========================================
    function triggerImageUpload() {
        setTool('cursor');
        document.getElementById('image-upload').click();
    }

    document.getElementById('image-upload').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(event) {
            const imgWrapper = document.createElement('div');
            imgWrapper.className = 'draggable-img';
            imgWrapper.style.left = '30%';
            imgWrapper.style.top = '20%';

            const img = document.createElement('img');
            img.src = event.target.result;
            img.draggable = false; 

            imgWrapper.appendChild(img);
            shapeContainer.appendChild(imgWrapper);
            
            makeDraggable(imgWrapper);
        };
        reader.readAsDataURL(file);
        e.target.value = ''; 
    });

    // ==========================================
    // 10. DRAGGING & EDITING SYSTEM
    // ==========================================
    function makeDraggable(el) {
        let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
        let clickStartX = 0, clickStartY = 0;
        let hasDragged = false;

        el.onmousedown = dragMouseDown;
        
        // Setup Double Click to Edit
        el.ondblclick = (e) => {
            if (el.classList.contains('draggable-text')) {
                e.stopPropagation();
                enterTextEditMode(el);
            }
        };

        function dragMouseDown(e) {
            if (activeTool === 'draw' || activeTool === 'eraser') return;
            if (el.contentEditable === "true") return; 

            e.preventDefault();
            e.stopPropagation(); 
            
            pos3 = e.clientX; 
            pos4 = e.clientY;
            clickStartX = e.clientX;
            clickStartY = e.clientY;
            hasDragged = false;
            
            document.onmouseup = closeDragElement;
            document.onmousemove = elementDrag;
        }

        function elementDrag(e) {
            e.preventDefault();
            hasDragged = true;
            let dx = pos3 - e.clientX;
            let dy = pos4 - e.clientY;
            
            if (isMirrored && !isRotated) dx = -dx;
            else if (!isMirrored && isRotated) { dx = -dx; dy = -dy; }
            else if (isMirrored && isRotated) dy = -dy; 

            pos1 = dx; pos2 = dy;
            pos3 = e.clientX; pos4 = e.clientY;
            
            el.style.top = (el.offsetTop - pos2) + "px";
            el.style.left = (el.offsetLeft - pos1) + "px";
            
            if (el === selectedText) updateTextControlsPosition();
        }

        function closeDragElement(e) {
            document.onmouseup = null; 
            document.onmousemove = null;
            
            let moveDistance = Math.abs(e.clientX - clickStartX) + Math.abs(e.clientY - clickStartY);
            
            if (!hasDragged || moveDistance < 5) {
                if (el.classList.contains('draggable-text')) {
                    if (el.contentEditable !== "true") {
                        selectTextElement(el);
                    }
                } else {
                    el.remove(); 
                }
            } else if (hasDragged && el.classList.contains('draggable-text')) {
                selectTextElement(el); 
            }
        }
    }
</script>
